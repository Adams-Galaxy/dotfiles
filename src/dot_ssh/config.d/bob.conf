# Bob is reachable through its Fedora Tailscale node. MagicDNS replaces the
# former SSID-sensitive LAN name and public DDNS endpoint with one stable path.
Host bob
    HostName bob.korat-rockhopper.ts.net
    User adam
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes

# Remote-SSH needs a dedicated connection for its dynamic SOCKS forward.
# Keep the normal `bob` alias multiplexed for interactive shell sessions.
Host bob-vscode
    HostName bob.korat-rockhopper.ts.net
    User adam
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    ControlMaster no
    ControlPath none
