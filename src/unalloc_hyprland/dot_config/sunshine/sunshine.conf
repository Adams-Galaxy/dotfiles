# Wombat owns the non-secret policy in this file. Sunshine keeps credentials,
# certificates, and pairing state in its separate runtime state file.
capture = wlr
encoder = nvenc
output_name = REMOTE
audio_sink = remote-desktop
hevc_mode = 2
av1_mode = 1
upnp = disabled
origin_web_ui_allowed = pc
address_family = ipv4
lan_encryption_mode = 0
wan_encryption_mode = 0
system_tray = disabled
