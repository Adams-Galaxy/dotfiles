# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[mgr]
cwd = { fg = "#8ec07c" }

# Find
find_keyword = { fg = "#fabd2f", bold = true, italic = true, underline = true }
find_position = { fg = "#d3869b", bg = "reset", bold = true, italic = true }

# Marker
marker_copied = { fg = "#b8bb26", bg = "#b8bb26" }
marker_cut = { fg = "#fb4934", bg = "#fb4934" }
marker_marked = { fg = "#8ec07c", bg = "#8ec07c" }
marker_selected = { fg = "#fabd2f", bg = "#fabd2f" }

# Count
count_copied = { fg = "#1d2021", bg = "#b8bb26" }
count_cut = { fg = "#1d2021", bg = "#fb4934" }
count_selected = { fg = "#1d2021", bg = "#fabd2f" }

# Border
border_symbol = "│"
border_style = { fg = "#928374" }

# : }}}


# : Tabs {{{

[tabs]
active = { fg = "#1d2021", bg = "#fabd2f", bold = true }
inactive = { fg = "#fabd2f", bg = "#3c3836" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#1d2021", bg = "#fabd2f", bold = true }
normal_alt = { fg = "#fabd2f", bg = "#3c3836" }

# Select mode
select_main = { fg = "#1d2021", bg = "#83a598", bold = true }
select_alt = { fg = "#83a598", bg = "#3c3836" }

# Unset mode
unset_main = { fg = "#1d2021", bg = "#fb4934", bold = true }
unset_alt = { fg = "#fb4934", bg = "#3c3836" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep = { fg = "#928374" }
perm_type = { fg = "#83a598" }
perm_read = { fg = "#fabd2f" }
perm_write = { fg = "#fb4934" }
perm_exec = { fg = "#b8bb26" }

# Progress
progress_label = { fg = "#ebdbb2", bold = true }
progress_normal = { fg = "#b8bb26", bg = "#504945" }
progress_error = { fg = "#fabd2f", bg = "#fb4934" }

# : }}}


# : Pick {{{

[pick]
border = { fg = "#665c54" }
active = { fg = "#d3869b", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border = { fg = "#665c54" }
title = {}
value = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#665c54" }

# : }}}


# : Tasks {{{

[tasks]
border = { fg = "#665c54" }
title = {}
hovered = { fg = "#d3869b", bold = true }

# : }}}


# : Which {{{

[which]
mask = { bg = "#3c3836" }
cand = { fg = "#83a598" }
rest = { fg = "#a89984" }
desc = { fg = "#d3869b" }
separator = "  "
separator_style = { fg = "#7c6f64" }

# : }}}


# : Help {{{

[help]
on = { fg = "#83a598" }
run = { fg = "#d3869b" }
hovered = { reversed = true, bold = true }
footer = { fg = "#3c3836", bg = "#d5c4a1" }

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#665c54" }
title = { fg = "#665c54" }
tbl_col = { fg = "#83a598" }
tbl_cell = { fg = "#d3869b", bg = "#504945" }

# : }}}


# : Notification {{{

[notify]
title_info = { fg = "#b8bb26" }
title_warn = { fg = "#fabd2f" }
title_error = { fg = "#fb4934" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
    # Image
    { mime = "image/*", fg = "#8ec07c" },
    # Media
    { mime = "{audio,video}/*", fg = "#fabd2f" },
    # Archive
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#d3869b" },
    # Document
    { mime = "application/{pdf,doc,rtf}", fg = "#b8bb26" },
    # Virtual file system
    { mime = "vfs/{absent,stale}", fg = "#a89984" },
    # Fallback
    { url = "*", fg = "#d5c4a1" },
    { url = "*/", fg = "#8ec07c" },
]

# : }}}

[icon]

dirs = [
    { name = ".config", text = "", fg = "#d3869b" },
    { name = ".git", text = "", fg = "#fe8019" },
    { name = ".github", text = "", fg = "#fe8019" },
    { name = ".npm", text = "", fg = "#fb4934" },
    { name = "Desktop", text = "", fg = "#83a598" },
    { name = "Development", text = "", fg = "#fe8019" },
    { name = "Documents", text = "", fg = "#fabd2f" },
    { name = "Downloads", text = "", fg = "#b8bb26" },
    { name = "Library", text = "", fg = "#d3869b" },
    { name = "Movies", text = "", fg = "#fb4934" },
    { name = "Music", text = "", fg = "#8ec07c" },
    { name = "Pictures", text = "", fg = "#83a598" },
    { name = "Public", text = "", fg = "#b8bb26" },
    { name = "Videos", text = "", fg = "#fb4934" },
]
conds = [
    # Special files
    { if = "orphan", text = "", fg = "#d5c4a1" },
    { if = "link", text = "", fg = "#928374" },
    { if = "block", text = "", fg = "#fb4934" },
    { if = "char", text = "", fg = "#fb4934" },
    { if = "fifo", text = "", fg = "#fb4934" },
    { if = "sock", text = "", fg = "#fb4934" },
    { if = "sticky", text = "", fg = "#fb4934" },
    { if = "dummy", text = "", fg = "#fb4934" },

    # Fallback
    { if = "dir", text = "", fg = "#8ec07c" },
    { if = "exec", text = "", fg = "#b8bb26" },
    { if = "!dir", text = "", fg = "#d5c4a1" },
]
