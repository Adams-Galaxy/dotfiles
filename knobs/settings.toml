# Shared, mostly-constant settings - not packages, not the theme, just the
# small facts a few modules need (git identity, etc). Read via
# w.toml.decode("knobs/settings.toml") and merged with the active profile's
# overrides in modules/settings.lua.
#
# Add a [profiles.<name>.<section>] table only for the keys that profile
# actually overrides - anything absent falls back to the section above.

[git]
full_name = "Adam Williams"
email = "adam.g.williams.nz@gmail.com"

[shell]
# Linux display servers are deliberately selected at construction time: the
# generated helper never guesses from WAYLAND_DISPLAY or DISPLAY at runtime.
linux_clipboard_backend = "wayland"

[theme]
name = "gruvbox-dark-hard"

# Example:
# [profiles.work.git]
# email = "you@work-email.com"
#
# [profiles.work.theme]
# name = "a-light-theme"
#
# [profiles.x11.shell]
# linux_clipboard_backend = "x11"
