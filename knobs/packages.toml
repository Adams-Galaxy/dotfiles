# Bootstrap package list. Loaded by modules/system/bootstrap.lua (one
# w.need per entry) and read again at root, in wombat.lua, to build the
# per-provider alias tables passed to w.providers() before any
# requirement is declared.
#
# Two shapes, matching Wombat's two requirement kinds:
#
#   [command.<name>]  Checked by command name on PATH first, falling
#                      back to a provider package query. Use this when
#                      the thing you actually care about is a binary
#                      being runnable (rg, fd, nvim, ...).
#
#     accept   Alternate command names also acceptable, tried in order
#              if the preferred name can't be resolved - e.g. Debian's
#              `fd` package publishes `fdfind`, not `fd`.
#     alias    Per-provider package-name override, only where a
#              provider's package name differs from the command name -
#              e.g. `alias.apt = "fd-find"` means: on apt, install
#              "fd-find" to satisfy the command "fd".
#
#   [package.<name>]  Checked purely against a provider's package
#                      database - no PATH check at all. Use this for
#                      anything with no associated binary (Debian's
#                      build-essential, ca-certificates, ...), where a
#                      command check would wrongly report "missing"
#                      against a correctly installed package.
#
#     provider  Pin to one provider by name. Optional - omit to
#               auto-try every configured provider, same as command.
#     with      Provider-specific data, passed straight through.
#     publishes Commands installed by the package. This preserves their
#               identity in the frozen provider binding when the package
#               itself, rather than a command requirement, owns resolution.
#
# Both shapes share:
#   os        Array of "macos"/"linux". Omit = both.
#   profiles  Array of profile names (see knobs/settings.toml). Omit = all.
#
# Known gap, not expressed here:
#   - antidote: needs a different provider *and* a dynamic `with.to`
#     (w.paths.home) per platform, which a static TOML table can't
#     express cleanly. Handled explicitly in modules/system/bootstrap.lua
#     instead, right after this file is loaded.

[command.git]

[command.curl]

[command.zsh]

[command.bash]
os = ["linux"]

[command.starship]
os = ["macos"]

[command.zoxide]

[command.atuin]

[command.direnv]

[command.just]

[command.eza]

[command.nvim]

[command.yazi]
os = ["macos"]

[command.fastfetch]

[command.fzf]

[command.fd]
accept = ["fdfind"]
alias = { apt = "fd-find" }

[command.rg]

[command.bat]
os = ["macos"]

[command.gh]

[command.lazygit]

[command.lazydocker]
os = ["macos"]

[command.btop]

[command.tmux]

[command.delta]
alias = { brew = "git-delta" }

[command.tree-sitter]
alias = { apt = "tree-sitter-cli" }

[command.tldr]
alias = { brew = "tealdeer", apt = "tealdeer" }

[command.gum]

[package.ca-certificates]
os = ["linux"]
provider = "apt"

[package.bat]
os = ["linux"]
provider = "apt"
publishes = { commands = ["batcat"] }

[package.yazi]
os = ["linux"]
provider = "apt"
with = { source = "yazi" }
publishes = { commands = ["yazi", "ya"] }
