# Bootstrap package list. Loaded and declared by modules/bootstrap.lua
# (one w.need.command() per matching row) and read again at root, in
# wombat.lua, to build the per-provider alias tables passed to
# w.providers() before any requirement is declared.
#
# `name` is the COMMAND w.need.command() checks for - not necessarily the
# package-manager name. Providers already know a few translations
# (rg -> ripgrep, nvim -> neovim) themselves; anything else goes in
# `alias` below.
#
#   os       Array of "macos"/"linux". Omit = both.
#   profiles Array of profile names (see data/settings.toml). Omit = all.
#   accept   Alternate command names also acceptable, tried in order if
#            the preferred name can't be resolved - e.g. Debian's `fd`
#            package publishes `fdfind`, not `fd`.
#   alias    Per-provider, per-command-name package-name override, only
#            where a provider's package name differs from the command
#            being resolved. `alias.apt.fdfind = "fd-find"` means: when
#            resolving the command "fdfind" on apt, install "fd-find".
#
# Known gaps, not expressed here yet:
#   - ca-certificates (linux): not a command, needs w.need.package()
#     against a real provider binding instead of this command-only loop.
#   - antidote (linux): previously git-cloned directly rather than
#     package-manager installed; needs its own acquisition, not a row
#     here. macos row below covers the Homebrew-installed case only.

[[package]]
name = "git"

[[package]]
name = "curl"

[[package]]
name = "zsh"

[[package]]
name = "bash"
os = ["linux"]

[[package]]
name = "starship"
os = ["macos"]

[[package]]
name = "zoxide"

[[package]]
name = "atuin"

[[package]]
name = "direnv"

[[package]]
name = "just"

[[package]]
name = "eza"

[[package]]
name = "nvim"

[[package]]
name = "yazi"

[[package]]
name = "fastfetch"

[[package]]
name = "fzf"

[[package]]
name = "fd"
accept = ["fdfind"]
alias = { apt = { fdfind = "fd-find" } }

[[package]]
name = "rg"

[[package]]
name = "bat"

[[package]]
name = "gh"

[[package]]
name = "lazygit"

[[package]]
name = "lazydocker"

[[package]]
name = "btop"

[[package]]
name = "tmux"

[[package]]
name = "delta"
alias = { brew = { delta = "git-delta" } }

[[package]]
name = "tree-sitter"

[[package]]
name = "tldr"
alias = { brew = { tldr = "tealdeer" }, apt = { tldr = "tealdeer" } }

[[package]]
name = "antidote"
os = ["macos"]

[[package]]
name = "gum"
