# Package manifest for shell bootstrap.
#
# One package per line, three whitespace-separated fields:
#   <name>  <profiles>  <overrides>
#
#   name       Canonical package name. Used for every package manager
#              unless overridden by the third field.
#   profiles   Comma-separated tags: at least one OS tag (macos, linux),
#              plus an optional custom profile tag (e.g. work) to
#              restrict the package to that profile. Untagged-for-profile
#              packages (just macos/linux, no extra tag) install under
#              every profile - only add a profile tag when a package
#              should be restricted to it.
#   overrides  Comma-separated manager=name pairs for managers that need
#              a different package name than <name>. "-" for none.
#              Recognised managers: brew apt dnf pacman zypper apk
#
# Edit with `dotpkg add/remove/list` rather than by hand where possible
# (see dot_config/zsh/env/dotpkg.zsh).

git              macos,linux   -
curl             macos,linux   -
zsh              macos,linux   -
bash             linux         -
ca-certificates  linux         -
starship         macos         -
zoxide           macos,linux   -
atuin            macos,linux   -
direnv           macos,linux   -
just             macos,linux   -
eza              macos,linux   -
neovim           macos,linux   -
yazi             macos,linux   -
fastfetch        macos,linux   -
fzf              macos,linux   -
fd               macos,linux   -
ripgrep          macos,linux   -
bat              macos,linux   -
gh               macos,linux   -
lazygit          macos,linux   -
lazydocker       macos,linux   -
btop             macos,linux   -
tmux             macos,linux   -
git-delta        macos,linux   apt=delta,dnf=delta
tree-sitter-cli  macos,linux   -
tealdeer         macos,linux   -
antidote         macos         -
