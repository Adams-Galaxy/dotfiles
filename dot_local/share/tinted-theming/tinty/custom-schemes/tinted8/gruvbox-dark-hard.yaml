# Custom tinted8 scheme, hand-authored (not from tinted-theming/schemes).
#
# Recreates this dotfiles repo's original, pre-tinted-theming hand-tuned
# palette (base16 gruvbox-dark-hard's hex values, see
# repos/schemes/base16/gruvbox-dark-hard.yaml in tinty's data dir) as a
# real tinted8 scheme, instead of the bundled tinted8-gruvbox-dark, whose
# muted "-normal" tones (e.g. red #cc241d) read as noticeably lower
# contrast than the vivid, single-tone-per-hue original.
#
# Each hue's normal/bright/dim values are set equal to each other
# (collapsed), on purpose: base16-gruvbox-dark-hard only ever had one
# vivid tone per hue, reused for both normal and bright ANSI slots, and
# that flat, high-contrast look is exactly what this scheme restores.
# The one deliberate exception is black-bright, set to gruvbox's #928374
# gray rather than a near-black shade - matching this repo's own
# pre-migration wezterm ansi[8] override (see git history), since
# genuinely dark "bright black" reads as almost invisible against an
# already very dark background.
#
# Lives in the chezmoi source tree (not hand-copied into tinty's data
# dir) so it travels with the repo across machines - chezmoi applies it
# straight to ~/.local/share/tinted-theming/tinty/custom-schemes/tinted8/
# like any other managed file.
scheme:
  system: "tinted8"
  supports:
    styling-spec: "0.2.0"
  author: "Adam Williams"
  family: "Gruvbox"
  style: "Dark Hard"
variant: "dark"
palette:
  black: "#1d2021"
  black-bright: "#928374"
  black-dim: "#1d2021"
  white: "#ebdbb2"
  white-bright: "#fbf1c7"
  white-dim: "#d5c4a1"
  gray: "#665c54"
  gray-bright: "#928374"
  gray-dim: "#665c54"
  red: "#fb4934"
  red-bright: "#fb4934"
  red-dim: "#fb4934"
  yellow: "#fabd2f"
  yellow-bright: "#fabd2f"
  yellow-dim: "#fabd2f"
  green: "#b8bb26"
  green-bright: "#b8bb26"
  green-dim: "#b8bb26"
  cyan: "#8ec07c"
  cyan-bright: "#8ec07c"
  cyan-dim: "#8ec07c"
  blue: "#83a598"
  blue-bright: "#83a598"
  blue-dim: "#83a598"
  magenta: "#d3869b"
  magenta-bright: "#d3869b"
  magenta-dim: "#d3869b"
  orange: "#fe8019"
  orange-bright: "#fe8019"
  orange-dim: "#fe8019"
  brown: "#d65d0e"
  brown-bright: "#d65d0e"
  brown-dim: "#d65d0e"
